<meta charset="utf-8">
<title>Belajar Sunan Kudus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: aplikasi satu layar. Bilah judul melayang di atas, isi dapat digulir, bilah navigasi tetap di bawah. Setiap halaman punya latar sendiri. */
:root{
  --royal:#1D4FD7; --deep:#0B2A6B; --emerald:#0E9F6E; --turq:#14B8C4; --gold:#F2B632; --orange:#F08A24; --violet:#7B4FD1; --rose:#E0457B;
  --ink:#12213F; --muted:#51618A; --paper:#FFFFFF; --mist:#EEF4FF; --ok:#0E9F6E; --warn:#E8761A;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --pc:var(--royal); color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0B2A6B;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
#bg,#pat,#scene{position:fixed;inset:0;pointer-events:none}
#bg{z-index:0;animation:bgin .6s both}
#pat{z-index:1}
#scene{z-index:2;opacity:.95}
#scene svg{width:100%;height:100%;display:block}
#shell{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;max-width:1120px;margin:0 auto}
#top{display:flex;align-items:center;gap:10px;padding-block:12px 6px}
.titlepill{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:22px;padding:8px 16px 8px 8px;box-shadow:0 6px 22px rgba(8,28,80,.2)}
.titlepill h1{font-family:var(--f-display);font-weight:800;font-size:clamp(18px,3.6vw,26px);line-height:1.15;color:var(--deep);text-wrap:balance}
.titlepill small{display:block;color:var(--muted);font-size:13px;font-weight:600;line-height:1.2}
.bubble{flex:none;width:48px;height:48px;border-radius:16px;background:var(--pc);color:#fff;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.bubble .ico{width:26px;height:26px}
#prog{flex:none;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border-radius:18px;padding:8px 12px;font-weight:800;color:var(--deep);font-size:14px;box-shadow:0 6px 22px rgba(8,28,80,.2)}
#prog i{display:block;width:64px;height:8px;border-radius:8px;background:#D7E3FA;overflow:hidden}
#prog b{display:block;height:100%;background:linear-gradient(90deg,var(--emerald),var(--turq));border-radius:8px;transition:width .5s}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:8px 14px;scroll-behavior:smooth}
.wrap{animation:pagein .5s cubic-bezier(.2,.8,.2,1) both}
#bottom{display:flex;gap:10px;justify-content:center;align-items:center;padding:10px;margin-bottom:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-radius:24px;box-shadow:0 8px 28px rgba(8,28,80,.28)}
#bottom .btn{flex:1;max-width:260px}
body.nonav #bottom,body.nonav #prog{display:none}
.ico{width:1em;height:1em;display:inline-block}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}

/* tombol */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border:0;border-radius:15px;background:var(--c,var(--royal));color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.2),0 8px 18px rgba(8,28,80,.18);transition:transform .15s,box-shadow .15s,filter .15s}
.btn .ico{font-size:20px}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 6px 0 rgba(0,0,0,.2),0 12px 22px rgba(8,28,80,.22)}
.btn:active{transform:translateY(2px) scale(.97);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:grayscale(.4)}
.btn.ghost{background:#E6EEFF;color:var(--deep);box-shadow:0 4px 0 #C4D3F2}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}

/* kartu */
.card{background:var(--paper);border-radius:22px;padding:18px;box-shadow:0 8px 28px rgba(8,28,80,.16);min-width:0}
.card h2{font-family:var(--f-display);font-size:22px;color:var(--deep);line-height:1.2;margin-bottom:8px}
.card h3{font-family:var(--f-display);font-size:18px;color:var(--deep);line-height:1.2;margin-bottom:4px}
.card p,.card li{color:#24365F}
.link{cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:left;border:0;font:inherit;width:100%}
.link:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:0 16px 34px rgba(8,28,80,.26)}
.link:active{transform:scale(.97)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:var(--c,var(--royal));color:#fff;font-weight:800;font-size:13px}
.chip.soft{background:#E4EDFF;color:var(--deep)}
.note{background:#FFF3C4;border:2px solid #E3B93A;border-radius:16px;padding:12px 14px;color:#4A3600;font-weight:600}
.note.green{background:#DDF6EB;border-color:#79D2A8;color:#0A4D33}
.ph{border:3px dashed #8FA9DD;border-radius:18px;background:repeating-linear-gradient(45deg,#F2F6FF,#F2F6FF 10px,#E8EFFD 10px,#E8EFFD 20px);color:#4A63A5;display:grid;place-items:center;text-align:center;font-weight:800;padding:12px;font-size:14px}
.ph .ico{font-size:30px;display:block;margin:0 auto 4px}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c,var(--royal));color:#fff;display:grid;place-items:center;font-weight:800}
.ib{flex:none;width:52px;height:52px;border-radius:16px;background:var(--c,var(--royal));color:#fff;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.ib .ico{font-size:28px}
ul.tick{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.tick li{position:relative;padding-left:22px}
ul.tick li:before{content:"";position:absolute;left:0;top:8px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--emerald))}
.rise>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.rise-i{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}

/* animasi ikon */
.a-float{animation:float 3.2s ease-in-out infinite}
.a-pulse{animation:pulse 2.4s ease-in-out infinite}
.a-spin{animation:spin 9s linear infinite}
.link:hover .ico,.btn:hover .ico,.dcard:hover .ico{animation:wiggle .6s}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wiggle{20%{transform:rotate(-14deg) scale(1.15)}50%{transform:rotate(12deg) scale(1.15)}80%{transform:rotate(-6deg)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes pagein{from{opacity:0;transform:translateX(26px)}}
@keyframes bgin{from{opacity:.2}}
@keyframes rip{to{transform:scale(3);opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes lid{0%{transform:rotate(0)}40%{transform:rotate(-8deg) translateY(-4px)}100%{transform:rotate(-38deg) translate(-18px,-30px)}}
@keyframes glow{50%{filter:drop-shadow(0 0 16px #FFE08A)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* login */
.login{min-height:100%;display:grid;align-items:center;padding-block:10px}
.logincard{max-width:460px;text-align:center;padding:26px 24px}
.logo{width:92px;height:92px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;border:3px dashed #8FA9DD;background:#F2F6FF;color:#4A63A5;font-weight:800;font-size:13px;line-height:1.2}
.kicker{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;color:var(--emerald)}
.logincard h2{font-size:clamp(26px,5vw,34px);margin:4px 0 6px}
.field{width:100%;border:2px solid #C4D3F2;border-radius:14px;padding:12px 14px;font:inherit;color:var(--ink);background:#fff;transition:border .2s,box-shadow .2s}
.field:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 4px rgba(29,79,215,.18)}
textarea.field{min-height:90px;resize:vertical}
label.l{display:block;text-align:left;font-weight:800;color:var(--deep);margin-bottom:5px}

/* dasbor */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.dcard{position:relative;border:0;cursor:pointer;background:rgba(255,255,255,.95);border-radius:22px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-weight:800;color:var(--deep);font-size:15px;line-height:1.2;box-shadow:0 8px 24px rgba(8,28,80,.2);transition:transform .2s,box-shadow .2s;animation:rise .5s both;animation-delay:calc(var(--i)*45ms);overflow:hidden}
.dcard:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 18px 34px rgba(8,28,80,.3)}
.dcard:active{transform:scale(.95)}
.dcard .ib{width:62px;height:62px;border-radius:20px;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 6px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.4)}
.dcard .ib .ico{font-size:32px}
.dcard .done{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--emerald);color:#fff;display:grid;place-items:center;font-size:14px}
.stat{display:flex;gap:12px;align-items:center}
.stat b{font-family:var(--f-display);font-size:26px;color:var(--deep);line-height:1}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
.confirm{position:fixed;inset:0;z-index:50;background:rgba(8,20,60,.6);display:grid;place-items:center;padding:20px}
.confirm .card{max-width:380px;text-align:center;animation:pop .35s both}

/* peta */
.map{width:100%;height:auto;border-radius:22px;background:linear-gradient(#2B7FD4,#1B5FB8);box-shadow:0 8px 28px rgba(8,28,80,.2)}
.pin{cursor:pointer}
.pin circle.c{transition:r .2s,fill .2s}
.pin:hover circle.c,.pin.on circle.c{r:11;fill:#F2B632}
.flow{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:10 8;animation:dash 1.2s linear infinite}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:0;cursor:pointer;padding:9px 16px;border-radius:99px;background:#E4EDFF;color:var(--deep);font-weight:800;transition:all .2s}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:var(--c,var(--royal));color:#fff;box-shadow:0 4px 12px rgba(8,28,80,.25)}

/* galeri */
.frame{position:relative;border:0;cursor:pointer;padding:12px 12px 14px;background:linear-gradient(145deg,#F7D66B,#B8860B);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.5);transition:transform .25s;text-align:center;color:#2A1B00}
.frame:hover{transform:translateY(-8px) scale(1.03)}
.frame .art{background:#F8FBFF;border-radius:4px;height:190px;display:grid;place-items:center;box-shadow:inset 0 0 18px rgba(0,0,0,.25);overflow:hidden}
.frame .art svg{width:86%;height:92%}
.frame b{display:block;font-family:var(--f-display);font-size:18px;margin-top:8px}
.frame small{font-weight:700}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(5,10,30,.82);display:grid;place-items:center;padding:20px}
.lightbox .card{max-width:480px;width:100%;text-align:center;animation:pop .35s both}
.lightbox .art{height:260px;background:#F8FBFF;border-radius:14px;display:grid;place-items:center;margin-bottom:10px}
.lightbox .art svg{width:70%;height:94%}

/* timeline */
.tl{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:34px}
.tl:before{content:"";position:absolute;left:14px;top:6px;bottom:6px;width:5px;border-radius:5px;background:repeating-linear-gradient(#fff 0 10px,transparent 10px 18px)}
.tl .ev{position:relative}
.tl .ev:before{content:"";position:absolute;left:-30px;top:20px;width:18px;height:18px;border-radius:50%;background:var(--c);border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.year{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--c)}

/* video */
.screen{aspect-ratio:16/9;border-radius:20px;background:radial-gradient(circle at 50% 40%,#1E3C8C,#070D26);border:4px solid var(--gold);display:grid;place-items:center;text-align:center;color:#fff;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.playbtn{width:84px;height:84px;border-radius:50%;background:#D93B2B;display:grid;place-items:center;border:4px solid #fff;margin:0 auto 10px;font-size:40px;animation:pulse 2s infinite}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px;border-radius:12px}
.chk:hover{background:#EEF4FF}
.chk input{width:22px;height:22px;accent-color:var(--emerald);flex:none;margin-top:2px}

/* kuis, lkpd, game */
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:3px solid #D5E1F7;background:#fff;border-radius:16px;padding:12px 14px;cursor:pointer;font-weight:700;color:var(--ink);transition:transform .15s,border .15s,background .15s}
.opt:hover:not(:disabled){transform:translateX(5px);border-color:var(--royal);background:#F3F7FF}
.opt .num{background:#C9D8F5;color:var(--deep)}
.opt.sel{border-color:var(--royal);background:#E4EDFF}
.opt.sel .num{background:var(--royal);color:#fff}
.opt.right{border-color:var(--ok);background:#DDF6EB;animation:pop .4s}
.opt.right .num{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--warn);background:#FFE9D6;animation:shake .4s}
.opt.wrong .num{background:var(--warn);color:#fff}
.opt:disabled{cursor:default}
.bar{height:12px;border-radius:12px;background:#D7E3FA;overflow:hidden}
.bar b{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,var(--emerald),var(--turq));transition:width .5s}
.fb{border-radius:18px;padding:14px 16px;font-weight:600;animation:pop .35s both}
.fb.ok{background:#DDF6EB;border:2px solid #79D2A8;color:#0A4D33}
.fb.no{background:#FFEBDA;border:2px solid #F2A867;color:#6B3200}
.fb b{font-family:var(--f-display);font-size:19px;display:block}
.stars{display:flex;gap:4px;color:#D2DAEB}
.stars .on{color:var(--gold);animation:pop .4s both}
.stars .ico{font-size:26px}
.ring{position:relative;width:170px;height:170px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:16;stroke-linecap:round}
.ring .tr{stroke:#D7E3FA}
.ring .fg{stroke:var(--emerald);transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:44px;color:var(--deep)}
.box{position:relative;border:0;cursor:pointer;border-radius:22px;padding:16px 8px 14px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.25),0 16px 30px rgba(0,0,0,.35);transition:transform .2s;animation:rise .5s both;animation-delay:calc(var(--i)*70ms)}
.box:hover{transform:translateY(-8px) rotate(-2deg)}
.box:active{transform:scale(.94)}
.box .ico{font-size:44px;animation:float 3s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}
.box.dark{color:#3A2A00}
.box.done{filter:saturate(.55) brightness(.9)}
.box .tag{font-size:12px;background:rgba(0,0,0,.25);border-radius:99px;padding:2px 10px}
.chest{width:min(240px,70%);margin:6px auto 10px;color:#fff}
.chest .lid{transform-origin:20px 80px;animation:lid .9s .1s both}
.chest svg{width:100%;animation:glow 1.4s 1s 2}
.sel2{padding:9px 10px;border:2px solid #C4D3F2;border-radius:12px;font:inherit;background:#fff;min-width:0;width:100%;color:var(--ink)}
.tf{display:flex;gap:6px}
.tf button{flex:1;border:2px solid #C4D3F2;background:#fff;border-radius:12px;padding:8px;font-weight:800;cursor:pointer;color:var(--deep);transition:all .15s}
.tf button:hover{border-color:var(--royal)}
.tf button.on{background:var(--royal);border-color:var(--royal);color:#fff}
.res{margin-left:auto;font-weight:800;font-size:14px}
.res.ok{color:var(--ok)}.res.no{color:var(--warn)}
.review{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px}
.review.ok{background:#DDF6EB}.review.no{background:#FFEBDA}
.review .num{width:30px;height:30px;font-size:14px}

/* panjat kelapa */
.climber{transition:transform 1s cubic-bezier(.3,1.25,.5,1)}
.climber.slip .fig{animation:shake .5s}
.nut{transform-box:fill-box;transform-origin:center}
.nut.drop{animation:drop 1.3s cubic-bezier(.5,0,1,.6) both}
@keyframes drop{to{transform:translateY(330px) rotate(300deg)}}
.tree{display:block;width:100%;height:auto;max-height:min(58vh,560px);border-radius:20px;background:linear-gradient(#8FD3FF,#E3F6FF 70%,#F6E7B5)}
.nuts{display:flex;gap:4px}
.nuts{align-items:center}
.nuts .ico{font-size:22px;color:#D93B5B}
.nuts .lost{opacity:.22}
.modecard{display:flex;flex-direction:column;gap:8px;align-items:flex-start;color:var(--ink)}
.modecard .ib{width:64px;height:64px}
@media (prefers-reduced-motion:reduce){.climber{transition:none}}
@media (max-width:560px){#prog i{display:none}.btn{padding:10px 12px;font-size:15px}.titlepill{padding-right:10px}.bubble{width:42px;height:42px}}
</style>
<div id="bg"></div><div id="pat"></div><div id="scene"></div>
<div id="shell">
  <header id="top"><div class="titlepill"><span class="bubble a-float" id="tic"></span><div><h1 id="tt"></h1><small id="ts"></small></div></div><div id="prog" title="Progres belajar"><span id="pt"></span><i><b id="pb"></b></i></div></header>
  <main id="view"></main>
  <nav id="bottom" aria-label="Navigasi halaman">
    <button class="btn ghost" data-act="prev" id="bprev"></button>
    <button class="btn" style="--c:var(--deep)" data-go="dash"></button>
    <button class="btn" style="--c:var(--emerald)" data-act="next" id="bnext"></button>
  </nav>
</div>

<script>

 const head=`<div class="card rise-i" style="background:rgba(255,255,255,.96)"><div class="row" style="justify-content:space-between"><span class="chip" style="--c:${GC[G.cur]};${q.dark?'color:#3A2A00':''}">Kotak ${G.cur+1}: ${q.t}</span><span class="chip soft">${q.pts} poin</span></div>`;
 if(stage===0) return head+`<div class="chest" style="color:${GC[G.cur]}"><svg viewBox="0 0 160 130"><rect x="20" y="62" width="120" height="58" rx="8" fill="currentColor"/><rect x="20" y="62" width="120" height="14" fill="#000" opacity=".2"/><rect x="72" y="70" width="16" height="22" rx="3" fill="#F2B632" stroke="#fff" stroke-width="2"/><g class="lid"><path d="M20 62V44a60 30 0 01120 0v18z" fill="currentColor"/><path d="M20 62V44a60 30 0 01120 0v18z" fill="#fff" opacity=".18"/><circle cx="80" cy="56" r="6" fill="#F2B632"/></g></svg></div><h2 style="text-align:center">Kotak misteri menunggumu!</h2><p style="text-align:center;margin-bottom:12px">Siap menjawab teka-teki ${q.t.toLowerCase()}?</p><div class="row" style="justify-content:center"><button class="btn" style="--c:var(--violet);font-size:19px" data-act="gopen">${ico('gift')} Buka Kotak</button><button class="btn ghost" data-act="ghub">${ico('left')} Semua Kotak</button></div></div>`;
 if(stage===1){const hint=G.hint?`<div class="note"><b>Petunjuk:</b> ${q.hint}</div>`:'';
  return head+`<h2 style="margin-top:12px">${q.q}</h2><div class="stack" style="gap:10px;margin:12px 0">${q.opt.map((o,i)=>`<button class="opt ${G.pick===i?'sel':''}" data-act="gpick" data-i="${i}"><span class="num">${'ABC'[i]}</span>${o}</button>`).join('')}</div>${hint}<div class="row" style="margin-top:10px"><button class="btn" style="--c:var(--emerald)" data-act="gcheck" ${G.pick==null?'disabled':''}>${ico('check')} Periksa Jawaban</button><button class="btn ghost" data-act="ghint">${ico('bulb')} Petunjuk</button><button class="btn ghost" data-act="ghub">${ico('left')} Semua Kotak</button></div></div>`}

P.refleksi={t:'Refleksi Peserta Didik',ic:'pencil',c:'--turq',sub:'Tulis jawabanmu pada kolom di bawah',r(){
 const q=['Hal baru yang kupelajari hari ini...','Bagian yang masih kurang kupahami...','Sikap Sunan Kudus yang akan kuterapkan (mis. mendengar dulu, toleran) dan caranya...'];
 return `<div class="stack">${q.map((x,i)=>`<div class="card rise-i" style="--i:${i}"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="num" style="--c:var(${['--royal','--emerald','--turq'][i]})">${i+1}</span><div style="flex:1;min-width:0"><label class="l" for="rf${i}">${x}</label><textarea class="field" id="rf${i}" placeholder="Ketik jawabanmu di sini...">${esc(S.refl[i])}</textarea></div></div></div>`).join('')}
 <div class="row rise-i" style="--i:3;justify-content:center"><button class="btn ghost" data-go="dash">${ico('home')} Kembali ke Dasbor</button><button class="btn" style="--c:var(--emerald);font-size:18px" data-act="kirim">${ico('send')} Kirim</button></div><div id="kirimbox"></div></div>`},after(){[0,1,2].forEach(i=>$('#rf'+i)?.addEventListener('input',e=>{S.refl[i]=e.target.value;store.set('refl',S.refl);S.sent=false}))}};
P.kesimpulan={t:'Kesimpulan Materi',ic:'flag',c:'--orange',r(){
 const k=[['Biografi','Raden Ja\'far Shadiq, putra Sunan Ngudung, berperan di bidang militer dan keagamaan Demak pada masa Sultan Trenggana. Wafat 1550 M saat menjadi imam Subuh.','user','--royal'],['Strategi dakwah','Memahami masyarakat, memakai seni-budaya-teknologi lokal, memberi keteladanan nyata, dan mengembangkan keahlian lokal.','hand','--emerald'],['Masjid Menara Kudus','Dibangun sebagai sarana dakwah (1530 M di Kerjasan, selesai 1549 M), memadukan unsur Islam dan lokal bernuansa Hindu.','mosque','--orange'],['Toleransi','Menganjurkan kurban kerbau, bukan sapi, sebagai penghormatan kepada umat Hindu di Kudus.','heart','--rose'],['Warisan dan tradisi','Bangunan masjid, keahlian pertukangan, dan adat setempat seperti kurban kerbau. Dhandhangan dan Buka Luwur adalah tradisi setempat di luar buku siswa.','landmark','--turq'],['Fakta dan legenda','Bedakan catatan yang tertulis di buku dari cerita turun-temurun, seperti kisah menara dalam sapu tangan.','scale','--violet']];
 return `<div class="grid g2">${k.map((x,i)=>`<div class="card rise-i" style="--i:${i}"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="ib a-float" style="--c:var(${x[3]})">${ico(x[2])}</span><div style="min-width:0"><h3>${x[0]}</h3><p>${x[1]}</p></div></div></div>`).join('')}<div class="note green rise-i" style="--i:6;grid-column:1/-1"><b>Pesan untukmu:</b> bijak mendengar, menghormati perbedaan, dan memberi contoh nyata adalah cara berdakwah yang tetap relevan di sekolah dan di media sosial hari ini.</div></div>`}};
P.referensi={t:'Referensi',ic:'book',c:'--violet',sub:'Hanya sumber yang benar-benar dipakai',r(){
 return `<div class="stack" style="max-width:760px;margin:0 auto">${REFS.map((x,i)=>`<div class="card row rise-i" style="--i:${i};flex-wrap:nowrap;align-items:flex-start"><span class="num" style="--c:var(${['--royal','--emerald','--turq','--violet','--orange','--rose'][i]})">${i+1}</span><p style="min-width:0">${x}</p></div>`).join('')}</div>`}};
P.penutup={t:'Penutup',ic:'heart',c:'--rose',r(){
 return `<div class="login"><div class="card logincard rise-i" style="max-width:560px"><span class="ib a-float" style="--c:var(--rose);margin:0 auto 8px;width:70px;height:70px">${ico('heart')}</span><h2 style="font-size:clamp(34px,7vw,48px)">Terima Kasih</h2><p style="font-size:19px;font-weight:700;color:var(--deep)">Mari meneladani kebijaksanaan dalam berdakwah</p><p style="margin:10px 0 16px">Kamu sudah menjelajahi perjalanan Islam di Nusantara dan teladan Sunan Kudus. Sampai jumpa di pelajaran berikutnya!</p><div class="row" style="justify-content:center"><button class="btn" style="--c:var(--emerald)" data-go="dash">${ico('home')} Kembali ke Menu Utama</button><button class="btn ghost" data-go="login">${ico('key')} Ke Halaman Awal</button></div></div></div>`}};
/* ---------- mesin ---------- */
function titleOf(id){const p=P[id];return {t:p.t,s:typeof p.sub==='function'?p.sub():(p.sub||'')}}
function render(){const id=S.page,p=P[id];if(!p)return;
 document.body.classList.toggle('nonav',id==='login'||id==='penutup'&&false);
 document.documentElement.style.setProperty('--pc',`var(${p.c})`);
 setBg(id);
 $('#tt').textContent=p.t;const sub=typeof p.sub==='function'?p.sub():(p.sub||'');$('#ts').textContent=sub;$('#ts').style.display=sub?'block':'none';
 $('#tic').innerHTML=ico(p.ic);
 $('#view').innerHTML='<div class="wrap">'+p.r()+'</div>';$('#view').scrollTop=0;
 const ci=CHAIN.indexOf(id);const prev=CHAIN[ci-1],next=CHAIN[ci+1];
 $('#bprev').innerHTML=ico('left')+'Kembali';$('#bprev').disabled=!prev;$('#bprev').dataset.to=prev||'';
 $('#bnext').innerHTML='Berikutnya'+ico('right');$('#bnext').disabled=!next;$('#bnext').dataset.to=next||'';
 document.querySelector('[data-go="dash"]#home,#bottom [data-go="dash"]').innerHTML=ico('home')+'Beranda';
 const real=CHAIN.slice(2);if(id!=='login'&&id!=='dash'&&!S.visited.includes(id)){S.visited.push(id);store.set('visited',S.visited)}
 const n=Math.min(S.visited.filter(v=>real.includes(v)).length,real.length);$('#pt').textContent=n+' dari '+real.length;$('#prog').title='Progres belajar: '+n+' dari '+real.length+' halaman';$('#pb').style.width=(n/real.length*100)+'%';
 p.after&&p.after();fitAll();
 if(id==='kuis'||id==='eval'){const q=S.qz[id];if(q&&q.i>=q.list.length)animateRing()}
}
function animateRing(){const m=S.page,q=S.qz[m],pct=Math.round(q.score/q.list.length*100),C=2*Math.PI*70;requestAnimationFrame(()=>requestAnimationFrame(()=>{const fg=$('#fg');if(!fg)return;fg.style.strokeDashoffset=C*(1-pct/100);let k=0;const el=$('#pctn');const t=setInterval(()=>{k+=Math.max(1,Math.round(pct/24));if(k>=pct){k=pct;clearInterval(t)}el.textContent=k},40)}))}
function fitAll(root=document){root.querySelectorAll('.svgfit').forEach(el=>{const k=el.dataset.k;el.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block"><g>${SV[k]}</g></svg>`;const s=el.firstChild;try{const b=s.querySelector('g').getBBox();const pad=10;s.setAttribute('viewBox',`${b.x-pad} ${b.y-pad} ${b.width+2*pad} ${b.height+2*pad}`)}catch(e){s.setAttribute('viewBox','-150 -450 300 460')}});}
function go(id){if(!P[id]){return}if(id==='game'&&S.page!=='game')S.gv='hub';S.page=id;try{history.replaceState(null,'','#'+id)}catch(e){}render()}
/* ---------- aksi ---------- */
const A={
 masuk(){const v=$('#nm').value.trim();S.name=v;store.set('name',v);go('dash')},
 prev(d,t){go(t.dataset.to)},next(d,t){go(t.dataset.to)},
 keluar(){$('#modal').innerHTML=`<div class="confirm"><div class="card"><span class="ib" style="--c:var(--rose);margin:0 auto 8px">${ico('exit')}</span><h2>Keluar dari modul?</h2><p style="margin-bottom:14px">Progres belajarmu tetap tersimpan di perangkat ini.</p><div class="row" style="justify-content:center"><button class="btn ghost" data-act="closeModal">Batal</button><button class="btn" style="--c:var(--rose)" data-act="doexit">Ya, keluar</button></div></div></div>`},
 closeModal(){$('#modal').innerHTML=''},doexit(){$('#modal').innerHTML='';go('login')},
 part(d,t){const k=d.k;document.querySelectorAll('[data-act="part"]').forEach(b=>b.classList.toggle('on',b===t));$('#partart').innerHTML=sceneSvg(k);fitAll($('#partart'));$('#partinfo').textContent=k==='tower'?'Menara bata bertingkat: perpaduan unsur Islam dan lokal. Gambar ini ilustrasi buatan; foto asli ada pada Gambar 5.4 buku siswa.':'Lawang Kembar: gerbang kembar bernuansa lokal di kompleks masjid. Legenda menyebut pintu ini berasal dari Majapahit (tradisi, bukan fakta tercatat).'},
 gal(d){const g=GAL[+d.i];$('#modal').innerHTML=`<div class="lightbox" data-act="closeModal"><div class="card"><div class="art">${sceneSvg(g[3])}</div><h2>${g[0]}</h2><p style="margin-bottom:12px">${g[1]}</p><div class="row" style="justify-content:center"><button class="btn ghost" data-act="closeModal">${ico('x')} Tutup</button><button class="btn" style="--c:var(--orange)" data-act="galgo" data-to="${g[2]}">Buka materi ${ico('right')}</button></div></div></div>`;fitAll($('#modal'))},
 galgo(d){$('#modal').innerHTML='';go(d.to)},
 /* game */
 war(d,t){document.querySelectorAll('#wartabs .tab').forEach(b=>b.classList.toggle('on',b===t));$('#warlist').innerHTML=warList(d.f)},
 gmode(d){S.gv=d.v;if(d.v==='box'){S.game.cur=null}if(d.v==='climb'&&S.cl.state==='done')S.cl=newClimb();render()},
 cstart(){S.cl.state='play';render()},
 crestart(){S.cl=newClimb();S.cl.state='play';render()},
 cpick(d){const c=S.cl;if(c.checked)return;c.pick=+d.i;render()},
 ccheck(){const c=S.cl,it=c.pool[c.order[c.i%c.order.length]];const ok=c.pick===it.ans;c.checked=true;c.last=ok;c.answered++;
  c.shown=c.h;if(ok){c.h++;c.right++}else{c.h=Math.max(0,c.h-1);c.lives--}
  if(c.h>S.cbest){S.cbest=c.h;store.set('climbBest',S.cbest)}render()},
 cnext(){const c=S.cl;if(c.h>=TOP||c.lives<=0){c.state='done';c.shown=c.h;render();return}c.i++;c.pick=null;c.checked=false;c.last=null;c.shown=c.h;render()},

 gsel(d){const G=S.game;G.cur=+d.i;G.stage=G.res[G.cur]!=null?2:0;G.hint=false;G.pick=G.res[G.cur]!=null?G.pick:null;G.tries=0;saveGame();render()},
 gopen(){S.game.stage=1;S.game.pick=null;S.game.hint=false;S.game.tries=0;saveGame();render()},
 gpick(d){S.game.pick=+d.i;render()},
 ghint(){S.game.hint=true;render()},
 gcheck(){const G=S.game,q=GAME[G.cur];if(G.pick===q.ans){G.res[G.cur]=G.tries===0?q.pts:Math.round(q.pts/2)}else{G.tries++;G.wrong=true}G.stage=2;saveGame();render()},
 gretry(){const G=S.game;G.stage=1;G.pick=null;saveGame();render()},
 gnext(){const G=S.game;const nx=[...Array(7).keys()].find(i=>G.res[i]==null);G.cur=nx;G.stage=0;G.pick=null;G.hint=false;G.tries=0;saveGame();render()},
 ghub(){const G=S.game;if(G.cur!=null&&G.res[G.cur]==null&&G.stage===2){/* belum benar: kembali ke hub */}G.cur=null;saveGame();render()},
 greset(){S.game={res:{},cur:null,stage:0,hint:false,pick:null,tries:0};saveGame();render()},
 /* kuis */
 qstart(d){const m=d.m;S.qz[m]={list:QDATA[m](),i:0,pick:null,checked:false,score:0,ans:[]};if(S.page!==m)go(m);else render()},
 qpick(d){const q=S.qz[d.m];if(q.checked)return;q.pick=+d.i;render()},
 qcheck(d){const q=S.qz[d.m],it=q.list[q.i];q.checked=true;const ok=q.pick===it.ans;q.ans[q.i]=ok;if(ok)q.score++;render()},
 qnext(d){const m=d.m,q=S.qz[m];q.i++;q.pick=null;q.checked=false;if(q.i>=q.list.length){const pct=Math.round(q.score/q.list.length*100);if(S.best[m]==null||pct>S.best[m]){S.best[m]=pct;store.set('best',S.best)}}render()},
 kirim(){S.sent=true;const t=reflText();$('#kirimbox').innerHTML=`<div class="card rise-i"><h2>Refleksi siap dikirim</h2><p style="margin-bottom:8px">Tersimpan di perangkat ini. Aplikasi ini tidak punya server, jadi teks belum terkirim otomatis. Salin teks di bawah, lalu kirim ke gurumu lewat saluran kelas, misalnya WhatsApp, email, atau LMS.</p><textarea class="field" id="rtext" readonly rows="8">${esc(t)}</textarea><div class="row" style="margin-top:10px"><button class="btn" style="--c:var(--royal)" data-act="salin">${ico('copy')} Salin Teks</button><button class="btn ghost" data-go="dash">${ico('home')} Kembali ke Dasbor</button></div><p id="copied" style="margin-top:6px;font-weight:800;color:var(--ok)"></p></div>`;$('#kirimbox').scrollIntoView({behavior:'smooth',block:'nearest'})},
 salin(){const ta=$('#rtext');const done=()=>{$('#copied').textContent='Teks tersalin. Tempel di pesan ke gurumu.'};const fb=()=>{ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}$('#copied').textContent=ok?'Teks tersalin. Tempel di pesan ke gurumu.':'Teks sudah terpilih. Tekan Ctrl+C (atau tahan lalu Salin) untuk menyalinnya.'};
  try{navigator.clipboard.writeText(ta.value).then(done,fb)}catch(e){fb()}}
};
function reflText(){const q=['Hal baru yang kupelajari','Bagian yang masih kurang kupahami','Sikap Sunan Kudus yang akan kuterapkan'];
 return `Refleksi SKI Kelas XI - Walisongo: Sunan Kudus\nNama: ${S.name||'(belum diisi)'}\nSekolah: ${S.school||'(belum diisi)'}\nSkor Evaluasi terbaik: ${S.best.eval==null?'-':S.best.eval}\nSkor Kuis terbaik: ${S.best.kuis==null?'-':S.best.kuis}\nPoin Game Box: ${gameTotal()}/100\n\n`+q.map((x,i)=>`${i+1}. ${x}:\n${S.refl[i]||'(belum diisi)'}`).join('\n\n')}
/* ---------- event ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('.btn,.dcard,.tab,.box');
 if(b&&!b.disabled){const r=document.createElement('span');r.className='ripple';const bb=b.getBoundingClientRect(),sz=Math.max(bb.width,bb.height);r.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-bb.left-sz/2}px;top:${e.clientY-bb.top-sz/2}px`;b.appendChild(r);setTimeout(()=>r.remove(),650)}
 const t=e.target.closest('[data-go],[data-act]');if(!t||t.disabled)return;
 if(t.matches('.confirm,.lightbox')&&e.target!==t)return;
 if(t.dataset.act){const f=A[t.dataset.act];if(f)f(t.dataset,t,e)}
 else if(t.dataset.go){$('#modal').innerHTML='';go(t.dataset.go)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').innerHTML='';if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pin')){e.preventDefault();A.pin(e.target.dataset)}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(P[id]&&id!==S.page){S.page=id;render()}});
const start=()=>{const id=location.hash.slice(1);S.page=P[id]&&id!=='login'?id:'login';render()};
window.claude?.hot?.ready?window.claude.hot.ready(start):start();
})();
</script>
